<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أكد (Akked) — Personal Data & Consent Guardian</title>
  <meta name="description" content="أثبت المطلوب، واحفظ الباقي. منصة ذكية لتقليص مشاركة الوثائق وحماية الخصوصية ومشاركة الحد الأدنى الضروري من البيانات فقط.">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">

  <style>
    /* Inline animations & keyframes */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="akkid-page-background">
  <div class="app-container">
    <!-- Persistent Sidebar Navigation -->
    <aside class="sidebar" id="app-sidebar">
      <!-- Sidebar Brand Header with Fixed Original Akkid Logo Asset -->
      <div class="sidebar-brand">
        <a href="#dashboard" class="brand-link" aria-label="أكّد - لوحة التحكم">
          <picture style="display: block; line-height: 0;">
            <source srcset="assets/akkid-logo.webp" type="image/webp">
            <img src="assets/akkid-logo.png" 
                 alt="أكّد - أثبت المطلوب، واحفظ الباقي" 
                 title="أكّد - أثبت المطلوب، واحفظ الباقي"
                 class="official-akkid-logo"
                 width="120" 
                 height="165" 
                 style="width: 120px; height: auto; max-width: 100%; display: block; object-fit: contain;">
          </picture>
        </a>
      </div>

      <!-- Main Navigation Menu -->
      <nav class="sidebar-nav">
        <!-- Prominent Create Share Button -->
        <div style="padding: 0 4px 14px;">
          <button class="sidebar-action-btn" onclick="AkkedApp.navigate('wizard')">
            <svg class="akked-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span data-i18n="createSecureShare">إنشاء مشاركة آمنة</span>
          </button>
        </div>

        <div class="nav-section-title" data-i18n="navDashboard">لوحة التحكم</div>
        
        <a class="nav-item active" data-view="dashboard" onclick="AkkedApp.navigate('dashboard')">
          <span class="nav-icon"><svg class="akked-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></span>
          <span data-i18n="navDashboard">لوحة التحكم</span>
        </a>

        <a class="nav-item" data-view="shares" onclick="AkkedApp.navigate('shares')">
          <span class="nav-icon"><svg class="akked-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg></span>
          <span data-i18n="navShares">المشاركات والإثباتات</span>
        </a>

        <a class="nav-item" data-view="verify" onclick="AkkedApp.navigate('verify')">
          <span class="nav-icon"><svg class="akked-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16" y2="16"/></svg></span>
          <span data-i18n="navVerifyPortal">بوابة التحقق للجهات</span>
        </a>

        <div class="nav-section-title" data-i18n="navMyData">الخصوصية والأمان</div>

        <a class="nav-item" data-view="entities" onclick="AkkedApp.navigate('entities')">
          <span class="nav-icon"><svg class="akked-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="9" y1="22" x2="9" y2="2"/><line x1="8" y1="6" x2="8.01" y2="6"/><line x1="16" y1="6" x2="16.01" y2="6"/><line x1="8" y1="10" x2="8.01" y2="10"/><line x1="16" y1="10" x2="16.01" y2="10"/><line x1="8" y1="14" x2="8.01" y2="14"/><line x1="16" y1="14" x2="16.01" y2="14"/><line x1="8" y1="18" x2="8.01" y2="18"/><line x1="16" y1="18" x2="16.01" y2="18"/></svg></span>
          <span data-i18n="navTrustedEntities">الجهات الموثوقة</span>
        </a>

        <a class="nav-item" data-view="mydata" onclick="AkkedApp.navigate('mydata')">
          <span class="nav-icon"><svg class="akked-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><circle cx="8" cy="10" r="2"/><path d="M12 16a4 4 0 0 0-8 0"/><line x1="14" y1="9" x2="18" y2="9"/><line x1="14" y1="13" x2="18" y2="13"/></svg></span>
          <span data-i18n="navMyData">خزنة بياناتي</span>
        </a>

        <a class="nav-item" data-view="alerts" onclick="AkkedApp.navigate('alerts')">
          <span class="nav-icon"><svg class="akked-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span>
          <span data-i18n="navAlerts">التنبيهات وسجل النشاط</span>
          <span class="badge-count" id="sidebar-alerts-count" style="display: none;">0</span>
        </a>

        <a class="nav-item" data-view="settings" onclick="AkkedApp.navigate('settings')">
          <span class="nav-icon"><svg class="akked-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
          <span data-i18n="navSettings">الإعدادات</span>
        </a>
      </nav>
    </aside>

    <!-- Overlay backdrop for mobile sidebar drawer -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="AkkedApp.toggleMobileSidebar()"></div>

    <!-- Animated Selective Disclosure Background Layer -->
    <div class="site-animated-background" id="site-animated-bg" aria-hidden="true">
      <div class="bg-illustration-wrapper">
        <!-- Ambient Lighting Glows Behind Smartphone -->
        <div class="bg-ambient-glow bg-glow-mint"></div>
        <div class="bg-ambient-glow bg-glow-purple"></div>

        <!-- Subtle Selective Data-Flow Paths & Particle Points -->
        <svg class="bg-data-flow-svg" viewBox="0 0 1100 660" preserveAspectRatio="xMidYMid meet">
          <!-- Flow Paths: thin and partially transparent -->
          <path id="dataPathSlate" class="data-flow-path" d="M 260 210 Q 420 230 540 280" />
          <path id="dataPathPurple" class="data-flow-path" d="M 240 310 Q 400 310 540 300" />
          <path id="dataPathMint" class="data-flow-path data-flow-path-mint" d="M 280 150 Q 440 180 545 285 Q 550 350 550 420 Q 550 480 550 530" />

          <!-- Moving Point 1: Slate Blue toward phone (fades out at funnel) -->
          <circle class="flow-particle particle-slate" r="3.5">
            <animateMotion dur="13s" repeatCount="indefinite" path="M 260 210 Q 420 230 540 280" keyPoints="0;1" keyTimes="0;1" />
            <animate attributeName="opacity" values="0;0.7;0.7;0;0" keyTimes="0;0.1;0.45;0.5;1" dur="13s" repeatCount="indefinite" />
          </circle>

          <!-- Moving Point 2: Deep Purple toward phone (fades out at funnel) -->
          <circle class="flow-particle particle-purple" r="3.5">
            <animateMotion dur="13s" repeatCount="indefinite" path="M 240 310 Q 400 310 540 300" keyPoints="0;1" keyTimes="0;1" begin="1.5s" />
            <animate attributeName="opacity" values="0;0.65;0.65;0;0" keyTimes="0;0.1;0.45;0.5;1" dur="13s" repeatCount="indefinite" begin="1.5s" />
          </circle>

          <!-- Moving Point 3: Single Mint Point passes through funnel and continues to verified-result card -->
          <circle class="flow-particle particle-mint" r="4">
            <animateMotion dur="13s" repeatCount="indefinite" path="M 280 150 Q 440 180 545 285 Q 550 350 550 420 Q 550 480 550 530" keyPoints="0;1" keyTimes="0;1" begin="0.5s" />
            <animate attributeName="opacity" values="0;0.85;0.85;0.9;0.95;0" keyTimes="0;0.1;0.4;0.7;0.95;1" dur="13s" repeatCount="indefinite" begin="0.5s" />
          </circle>
        </svg>

        <picture class="bg-layer bg-layer-cards">
          <source srcset="assets/layer-cards.webp" type="image/webp">
          <img src="assets/layer-cards.png" alt="" class="bg-layer-img">
        </picture>
        <picture class="bg-layer bg-layer-phone">
          <source srcset="assets/layer-phone.webp" type="image/webp">
          <img src="assets/layer-phone.png" alt="" class="bg-layer-img">
        </picture>
        <picture class="bg-layer bg-layer-result">
          <source srcset="assets/layer-result.webp" type="image/webp">
          <img src="assets/layer-result.png" alt="" class="bg-layer-img">
        </picture>
      </div>
      <div class="bg-readability-overlay"></div>
    </div>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <!-- Top Application Bar -->
      <header class="top-header">
        <div class="header-left">
          <button class="menu-toggle-btn" onclick="AkkedApp.toggleMobileSidebar()" aria-label="Toggle Navigation">
            <svg class="akked-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="page-breadcrumb">
            <span class="breadcrumb-prefix" style="font-size: 0.88rem; color: var(--brand-slate);">منصة أكد</span>
            <span class="breadcrumb-sep">/</span>
            <span class="current-page" id="page-breadcrumb-text">لوحة التحكم</span>
          </div>
        </div>

        <div class="header-right">
          <!-- Language Switcher Button -->
          <button class="header-btn" onclick="AkkedApp.toggleLanguage()" title="Change Language" aria-label="Change Language">
            <svg class="akked-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            <span id="lang-toggle-text">
              <span class="lang-text-full">English (LTR)</span>
              <span class="lang-text-compact">EN</span>
            </span>
          </button>

          <!-- Theme Switcher Button -->
          <button class="header-btn header-btn-icon" onclick="AkkedApp.toggleTheme()" title="Switch Dark/Light Theme">
            <svg class="akked-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
          </button>

          <!-- Notification Bell Button -->
          <div class="notification-badge-wrapper">
            <button class="header-btn header-btn-icon" onclick="AkkedApp.navigate('alerts')" title="Alerts">
              <svg class="akked-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            </button>
            <div class="notif-dot" id="header-notif-dot" style="display: none;"></div>
          </div>
        </div>
      </header>

      <!-- Dynamic View Container -->
      <main class="content-area" id="view-container">
        <!-- Rendered dynamically by AkkedApp.renderView() -->
      </main>
    </div>
  </div>

  <!-- Global Modal Dialog Container -->
  <div class="modal-backdrop" id="global-modal-backdrop" onclick="if(event.target === this) AkkedApp.closeModal()">
    <div class="modal-dialog">
      <div class="modal-header">
        <span style="font-weight: 800; font-size: 1.1rem; color: #5A1854;" data-i18n="brandName">أكّد</span>
        <button class="close-modal-btn" onclick="AkkedApp.closeModal()" aria-label="Close Modal">
          <svg class="akked-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="global-modal-body">
        <!-- Injected via AkkedApp.openModal() -->
      </div>
    </div>
  </div>

  <!-- Global Toast Alerts Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Application Logic Scripts -->
  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/crypto-utils.js"></script>
  <script src="js/sample-docs.js"></script>
  <script src="js/state.js"></script>
  <script src="js/redaction-engine.js"></script>
  <script src="js/components/dashboard.js"></script>
  <script src="js/components/shares.js"></script>
  <script src="js/components/wizard.js"></script>
  <script src="js/components/verify.js"></script>
  <script src="js/components/entities.js"></script>
  <script src="js/components/mydata.js"></script>
  <script src="js/components/alerts.js"></script>
  <script src="js/components/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
